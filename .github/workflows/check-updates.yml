name: Check for Dependency Updates

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: check-updates-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-updates:
    name: Detect dependency updates
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Update checks must run from $DEFAULT_BRANCH, not $GITHUB_REF"
            exit 1
          fi

      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the update-check Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check for dependency updates
        run: |
          if npm exec -- ncu --errorLevel 2; then
            exit 0
          else
            status=$?
          fi
          if [[ "$status" -eq 1 ]]; then
            echo "::error::Dependency updates are available. Run npm run update locally."
          fi
          exit "$status"
